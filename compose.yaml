services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxara
      POSTGRES_USER: fluxara
      POSTGRES_PASSWORD: fluxara_local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fluxara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxara -d fluxara"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fluxara-postgres-data:
